<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1132" viewBox="0 0 1280 1132" role="img" aria-labelledby="t d"><title id="t">La stack du projet à chaque étape</title><desc id="d">Six étapes dans Docker Compose : initialiser et importer, simuler le temps réel, collecter, transformer, charger, restituer. Airflow orchestre les étapes collecter, transformer et charger. Chaque étape liste ses technologies et leur rôle.</desc><style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;fill:#0b0b0b}
.ti{font-size:25px;font-weight:700} .fh{font-size:15.5px;font-weight:700} .fb{font-size:14.5px;fill:#52514e}
.st{font-size:14px;font-weight:600;fill:#52514e} .h{font-size:16.5px;font-weight:600} .w{font-size:13px;fill:#52514e}
.b{font-size:14.5px;fill:#52514e} .c{font-size:14px} .n{font-size:14.5px;font-weight:700;fill:#ffffff}
.m{font-family:Consolas,Menlo,"DejaVu Sans Mono",monospace;font-size:13px;fill:#52514e}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="1279" height="1131" rx="12" fill="#fcfcfb" stroke="#d6d5d0"/><text x="30" y="42" class="ti">Ma stack à chaque étape : quel outil, quand et pour quoi faire</text><rect x="14" y="62" width="1252" height="974" rx="12" fill="#f1f1ee" stroke="#52514e" stroke-width="1.6"/><text x="36" y="87" class="fb"><tspan class="fh">Docker et Docker Compose :</tspan> une image par service, douze conteneurs, un réseau interne et des volumes. Tout ce qui suit tourne dedans.</text><text x="84" y="124" class="st">Étape</text><text x="230" y="124" class="st">Stack utilisée</text><text x="654" y="124" class="st">Rôle dans le projet</text><rect x="24" y="432" width="1232" height="471" rx="12" fill="#f0eefb" stroke="#6250d6" stroke-width="1.8"/><text x="84" y="454" class="fb"><tspan class="fh">Apache Airflow 2.0 :</tspan> le DAG nyc_dag enchaîne ces trois étapes toutes les 15 minutes, pour le taxi et pour Citi Bike.</text><text x="84" y="475" class="fb">webserver et scheduler avec LocalExecutor, métadonnées dans PostgreSQL 12</text><rect x="36" y="134" width="1208" height="126" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><line x1="218" y1="144" x2="218" y2="250" stroke="#d6d5d0"/><line x1="642" y1="144" x2="642" y2="250" stroke="#d6d5d0"/><circle cx="60" cy="161" r="14" fill="#0b0b0b"/><text x="60" y="166.5" class="n" text-anchor="middle">1</text><text x="84" y="166" class="h">Initialiser</text><text x="84" y="186" class="h">et importer</text><text x="84" y="207" class="w">une seule fois, au</text><text x="84" y="225" class="w">premier démarrage</text><rect x="230" y="146" width="127" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="160.0" r="5.5" fill="#0b0b0b"/><text x="260" y="165" class="c">Airflow CLI</text><rect x="364" y="146" width="57" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="381" cy="160.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="394" y="165" class="c">mc</text><rect x="428" y="146" width="71" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="445" cy="160.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="458" y="165" class="c">wget</text><rect x="506" y="146" width="116" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="523" cy="160.0" r="5.5" fill="#eb6834"/><text x="536" y="165" class="c">DuckDB 2.0</text><rect x="230" y="181" width="112" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="195.0" r="5.5" fill="#eb6834"/><text x="260" y="200" class="c">unzip + awk</text><rect x="349" y="181" width="113" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="366" cy="195.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="379" y="200" class="c">psql COPY</text><rect x="469" y="181" width="142" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="486" cy="195.0" r="5.5" fill="#1baf7a"/><text x="499" y="200" class="c">PostgreSQL 13</text><text x="654" y="162" class="b">airflow db init prépare Airflow, et mc crée le bucket datalake dans MinIO.</text><text x="654" y="182" class="b">Taxi : wget télécharge les Parquet, DuckDB les échantillonne et écrit des CSV.</text><text x="654" y="202" class="b">Citi Bike : wget télécharge l'archive CSV de 2019, unzip et awk l'échantillonnent.</text><text x="654" y="222" class="b">psql COPY charge ensuite ces CSV dans deux bases PostgreSQL.</text><text x="654" y="244" class="m">initdb_adduser, minio_init, taxi_db, citibike_db</text><rect x="36" y="276" width="1208" height="136" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><line x1="218" y1="286" x2="218" y2="402" stroke="#d6d5d0"/><line x1="642" y1="286" x2="642" y2="402" stroke="#d6d5d0"/><circle cx="60" cy="303" r="14" fill="#0b0b0b"/><text x="60" y="308.5" class="n" text-anchor="middle">2</text><text x="84" y="308" class="h">Simuler le</text><text x="84" y="328" class="h">temps réel</text><text x="84" y="349" class="w">en continu</text><rect x="230" y="288" width="71" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="302.0" r="5.5" fill="#0b0b0b"/><text x="260" y="307" class="c">cron</text><rect x="308" y="288" width="71" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="325" cy="302.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="338" y="307" class="c">psql</text><rect x="386" y="288" width="109" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="403" cy="302.0" r="5.5" fill="#2a78d6"/><text x="416" y="307" class="c">nginx 1.19</text><rect x="502" y="288" width="104" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="519" cy="302.0" r="5.5" fill="#2a78d6"/><text x="532" y="307" class="c">Flask 2.0</text><rect x="230" y="323" width="177" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="337.0" r="5.5" fill="#2a78d6"/><text x="260" y="342" class="c">Flask-HTTPAuth 4.4</text><rect x="414" y="323" width="123" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="431" cy="337.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="444" y="342" class="c">psycopg2 2.8</text><rect x="230" y="358" width="142" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="372.0" r="5.5" fill="#1baf7a"/><text x="260" y="377" class="c">PostgreSQL 13</text><text x="654" y="304" class="b">Taxi : cron lance psql toutes les 15 minutes, et nginx sert les CSV produits.</text><text x="654" y="324" class="b">Citi Bike : Flask interroge PostgreSQL avec psycopg2, derrière HTTP Basic Auth.</text><text x="654" y="344" class="b">Les deux sources décalent les dates de 2019 vers l'année en cours.</text><text x="654" y="366" class="m">taxi_fileserver, citibike_api</text><rect x="36" y="486" width="1208" height="101" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><line x1="218" y1="496" x2="218" y2="577" stroke="#d6d5d0"/><line x1="642" y1="496" x2="642" y2="577" stroke="#d6d5d0"/><circle cx="60" cy="513" r="14" fill="#0b0b0b"/><text x="60" y="518.5" class="n" text-anchor="middle">3</text><text x="84" y="518" class="h">Collecter</text><rect x="230" y="498" width="145" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="512.0" r="5.5" fill="#0b0b0b"/><text x="260" y="517" class="c">PythonOperator</text><rect x="382" y="498" width="99" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="399" cy="512.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="412" y="517" class="c">requests</text><rect x="488" y="498" width="90" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="505" cy="512.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="518" y="517" class="c">S3Hook</text><rect x="230" y="533" width="85" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="547.0" r="5.5" fill="#1baf7a"/><text x="260" y="552" class="c">MinIO</text><text x="654" y="514" class="b">PythonOperator exécute le code de collecte, et requests interroge les sources.</text><text x="654" y="534" class="b">S3Hook dépose les données brutes dans MinIO, sous raw/.</text><text x="654" y="556" class="m">download_citi_bike_data, download_taxi_data</text><rect x="36" y="603" width="1208" height="136" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><line x1="218" y1="613" x2="218" y2="729" stroke="#d6d5d0"/><line x1="642" y1="613" x2="642" y2="729" stroke="#d6d5d0"/><circle cx="60" cy="630" r="14" fill="#0b0b0b"/><text x="60" y="635.5" class="n" text-anchor="middle">4</text><text x="84" y="635" class="h">Transformer</text><rect x="230" y="615" width="201" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="629.0" r="5.5" fill="#0b0b0b"/><text x="260" y="634" class="c">PandasOperator (maison)</text><rect x="438" y="615" width="85" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="455" cy="629.0" r="5.5" fill="#eb6834"/><text x="468" y="634" class="c">pandas</text><rect x="230" y="650" width="134" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="664.0" r="5.5" fill="#eb6834"/><text x="260" y="669" class="c">GeoPandas 0.8</text><rect x="371" y="650" width="121" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="388" cy="664.0" r="5.5" fill="#eb6834"/><text x="401" y="669" class="c">PyGEOS 0.7</text><rect x="499" y="650" width="128" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="516" cy="664.0" r="5.5" fill="#eb6834"/><text x="529" y="669" class="c">PyArrow 0.17</text><rect x="230" y="685" width="148" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="699.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="260" y="704" class="c">client minio 5.0</text><rect x="385" y="685" width="85" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="402" cy="699.0" r="5.5" fill="#1baf7a"/><text x="415" y="704" class="c">MinIO</text><text x="654" y="631" class="b">pandas calcule les durées des trajets taxi et renomme les colonnes.</text><text x="654" y="651" class="b">GeoPandas et PyGEOS situent les stations Citi Bike dans les zones de taxi.</text><text x="654" y="671" class="b">PyArrow écrit le Parquet, et le client minio le range sous processed/.</text><text x="654" y="693" class="m">process_citi_bike_data, process_taxi_data</text><rect x="36" y="755" width="1208" height="136" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><line x1="218" y1="765" x2="218" y2="881" stroke="#d6d5d0"/><line x1="642" y1="765" x2="642" y2="881" stroke="#d6d5d0"/><circle cx="60" cy="782" r="14" fill="#0b0b0b"/><text x="60" y="787.5" class="n" text-anchor="middle">5</text><text x="84" y="787" class="h">Charger</text><rect x="230" y="767" width="255" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="781.0" r="5.5" fill="#0b0b0b"/><text x="260" y="786" class="c">MinioPandasToPostgres (maison)</text><rect x="492" y="767" width="85" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="509" cy="781.0" r="5.5" fill="#eb6834"/><text x="522" y="786" class="c">pandas</text><rect x="230" y="802" width="148" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="816.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="260" y="821" class="c">client minio 5.0</text><rect x="385" y="802" width="122" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="402" cy="816.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="415" y="821" class="c">SQLAlchemy</text><rect x="514" y="802" width="85" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="531" cy="816.0" r="5.5" fill="#1baf7a"/><text x="544" y="821" class="c">MinIO</text><rect x="230" y="837" width="142" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="851.0" r="5.5" fill="#1baf7a"/><text x="260" y="856" class="c">PostgreSQL 13</text><text x="654" y="783" class="b">L'opérateur maison lit le Parquet de processed/ avec le client minio et pandas.</text><text x="654" y="803" class="b">SQLAlchemy et to_sql remplacent les lignes de l'exécution dans la base de résultats.</text><text x="654" y="825" class="m">citi_bike_to_db, taxi_to_db, result_db</text><rect x="36" y="919" width="1208" height="101" rx="10" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><line x1="218" y1="929" x2="218" y2="1010" stroke="#d6d5d0"/><line x1="642" y1="929" x2="642" y2="1010" stroke="#d6d5d0"/><circle cx="60" cy="946" r="14" fill="#0b0b0b"/><text x="60" y="951.5" class="n" text-anchor="middle">6</text><text x="84" y="951" class="h">Restituer</text><text x="84" y="972" class="w">à chaque visite</text><text x="84" y="990" class="w">de la page</text><rect x="230" y="931" width="104" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="945.0" r="5.5" fill="#2a78d6"/><text x="260" y="950" class="c">Flask 2.0</text><rect x="341" y="931" width="80" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="358" cy="945.0" r="5.5" fill="#2a78d6"/><text x="371" y="950" class="c">Jinja</text><rect x="428" y="931" width="132" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="445" cy="945.0" r="5.5" fill="#2a78d6"/><text x="458" y="950" class="c">Bootstrap 4.5</text><rect x="230" y="966" width="71" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="247" cy="980.0" r="5.5" fill="#eb6834"/><text x="260" y="985" class="c">SQL</text><rect x="308" y="966" width="123" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="325" cy="980.0" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="338" y="985" class="c">psycopg2 2.8</text><rect x="438" y="966" width="142" height="28" rx="14" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><circle cx="455" cy="980.0" r="5.5" fill="#1baf7a"/><text x="468" y="985" class="c">PostgreSQL 13</text><text x="654" y="947" class="b">SQL calcule les temps moyens et croise les trajets taxi et vélo.</text><text x="654" y="967" class="b">Flask rend la page avec Jinja et Bootstrap, et le plus rapide ressort en vert.</text><text x="654" y="989" class="m">nyc_transportation_api, port 8083</text><path d="M60 260V275" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/><path d="M60 412V485" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/><path d="M60 587V602" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/><path d="M60 739V754" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/><path d="M60 891V918" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/><text x="30" y="1073" class="st">Familles :</text><circle cx="112" cy="1068" r="5.5" fill="#1baf7a"/><text x="124" y="1073" class="c">Stockage</text><circle cx="217" cy="1068" r="5.5" fill="#eb6834"/><text x="229" y="1073" class="c">Traitement des données</text><circle cx="425" cy="1068" r="5.5" fill="#2a78d6"/><text x="437" y="1073" class="c">Web et API</text><circle cx="545" cy="1068" r="5.5" fill="#0b0b0b"/><text x="557" y="1073" class="c">Orchestration</text><circle cx="687" cy="1068" r="4.5" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/><text x="699" y="1073" class="c">Connecteurs et outils</text><text x="30" y="1102" class="w">Langages : Python 3.7 pour les API, Python 3.8 pour Airflow, SQL et Bash.</text></svg>