<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="432" viewBox="0 0 1330 432" role="img" aria-labelledby="t d"><title id="t">DAG nyc_dag</title><desc id="d">Deux branches indépendantes de trois tâches, Citi Bike et taxi : collecter, transformer, charger.</desc><style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;fill:#0b0b0b}
.ti{font-size:24px;font-weight:700} .st{font-size:15px;font-weight:600;fill:#52514e}
.h{font-size:16.5px;font-weight:600} .b{font-size:14.5px;fill:#52514e} .s{font-size:13.5px;fill:#52514e}
.m{font-family:Consolas,Menlo,"DejaVu Sans Mono",monospace;font-size:13.5px;fill:#52514e}
.mb{font-family:Consolas,Menlo,"DejaVu Sans Mono",monospace;font-size:15.5px;font-weight:700;fill:#0b0b0b}
</style><defs><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eda100"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="1329" height="431" rx="12" fill="#fcfcfb" stroke="#d6d5d0"/><text x="30" y="46" class="ti">DAG nyc_dag : deux branches indépendantes, toutes les 15 minutes</text><text x="130" y="84" class="st">Collecter</text><line x1="130" y1="94" x2="500" y2="94" stroke="#d6d5d0" stroke-width="2"/><text x="530" y="84" class="st">Transformer</text><line x1="530" y1="94" x2="900" y2="94" stroke="#d6d5d0" stroke-width="2"/><text x="930" y="84" class="st">Charger</text><line x1="930" y1="94" x2="1300" y2="94" stroke="#d6d5d0" stroke-width="2"/><text x="30" y="178" class="h">Citi Bike</text><rect x="130" y="112" width="370" height="122" rx="9" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><path d="M139 112H135a5 5 0 0 0-5 5V229a5 5 0 0 0 5 5H139z" fill="#2a78d6"/><text x="152" y="145" class="mb">download_citi_bike_data</text><text x="152" y="175" class="b">Appelle l'API : trajets des 15 dernières minutes</text><text x="152" y="212" class="m">Sortie : raw/citibike/{ts}.json</text><rect x="530" y="112" width="370" height="122" rx="9" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><path d="M539 112H535a5 5 0 0 0-5 5V229a5 5 0 0 0 5 5H539z" fill="#2a78d6"/><text x="552" y="145" class="mb">process_citi_bike_data</text><text x="552" y="175" class="b">Situe les stations dans les zones de taxi</text><text x="552" y="212" class="m">Sortie : processed/citibike/{ts}.parquet</text><rect x="930" y="112" width="370" height="122" rx="9" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><path d="M939 112H935a5 5 0 0 0-5 5V229a5 5 0 0 0 5 5H939z" fill="#2a78d6"/><text x="952" y="145" class="mb">citi_bike_to_db</text><text x="952" y="175" class="b">Remplace les lignes de cette exécution</text><text x="952" y="212" class="m">Sortie : table citi_bike_rides</text><path d="M500 173H530" fill="none" stroke="#2a78d6" stroke-width="2.8" marker-end="url(#ac)"/><path d="M900 173H930" fill="none" stroke="#2a78d6" stroke-width="2.8" marker-end="url(#ac)"/><text x="30" y="328" class="h">Taxi</text><rect x="130" y="262" width="370" height="122" rx="9" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><path d="M139 262H135a5 5 0 0 0-5 5V379a5 5 0 0 0 5 5H139z" fill="#eda100"/><text x="152" y="295" class="mb">download_taxi_data</text><text x="152" y="325" class="b">Copie les CSV encore absents du data lake</text><text x="152" y="362" class="m">Sortie : raw/taxi/*.csv</text><rect x="530" y="262" width="370" height="122" rx="9" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><path d="M539 262H535a5 5 0 0 0-5 5V379a5 5 0 0 0 5 5H539z" fill="#eda100"/><text x="552" y="295" class="mb">process_taxi_data</text><text x="552" y="325" class="b">Calcule les durées et renomme les colonnes</text><text x="552" y="362" class="m">Sortie : processed/taxi/{ts}.parquet</text><rect x="930" y="262" width="370" height="122" rx="9" fill="#ffffff" stroke="#d6d5d0" stroke-width="1.2"/><path d="M939 262H935a5 5 0 0 0-5 5V379a5 5 0 0 0 5 5H939z" fill="#eda100"/><text x="952" y="295" class="mb">taxi_to_db</text><text x="952" y="325" class="b">Remplace les lignes de cette exécution</text><text x="952" y="362" class="m">Sortie : table taxi_rides</text><path d="M500 323H530" fill="none" stroke="#eda100" stroke-width="2.8" marker-end="url(#at)"/><path d="M900 323H930" fill="none" stroke="#eda100" stroke-width="2.8" marker-end="url(#at)"/><text x="30" y="414" class="s">{ts} correspond à l'horodatage de l'exécution. Un échec dans une branche n'arrête pas l'autre.</text></svg>